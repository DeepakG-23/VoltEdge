<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" fill="none">
  <defs>
    <!-- Warm Amber Gold Gradient -->
    <linearGradient id="cmAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FBBF24" />
      <stop offset="50%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>

    <!-- Metallic Chrome Gradient -->
    <linearGradient id="cmChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="35%" stopColor="#E2E8F0" />
      <stop offset="70%" stopColor="#CBD5E1" />
      <stop offset="100%" stopColor="#94A3B8" />
    </linearGradient>

    <!-- Royal Electric Blue Gradient -->
    <linearGradient id="cmRoyalBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#3B82F6" />
      <stop offset="50%" stopColor="#2563EB" />
      <stop offset="100%" stopColor="#1D4ED8" />
    </linearGradient>

    <!-- Phone Frame Metallic Border -->
    <linearGradient id="cmPhoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="45%" stopColor="#CBD5E1" />
      <stop offset="85%" stopColor="#64748B" />
      <stop offset="100%" stopColor="#334155" />
    </linearGradient>

    <!-- Soft Cyber Screen Fill -->
    <linearGradient id="cmScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#1E293B" />
      <stop offset="100%" stopColor="#0F172A" />
    </linearGradient>

    <!-- Amber Glow Filter -->
    <filter id="cmAmberGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" floodColor="#F59E0B" floodOpacity="0.45" />
    </filter>

    <!-- Metallic 3D Drop Shadow -->
    <filter id="cmShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" floodColor="#000000" floodOpacity="0.75" />
    </filter>
  </defs>

  <!-- Background Soft Cyber Radial Backdrop -->
  <rect width="500" height="500" rx="36" fill="#0A0D14" />
  <circle cx="250" cy="180" r="140" fill="#2563EB" opacity="0.12" filter="blur(40px)" />

  <!-- Tilted Smartphone Body -->
  <g transform="translate(250 185) rotate(-11) translate(-250 -185)">
    <!-- Outer Phone Shell with Chrome Bevel -->
    <rect
      x="170"
      y="80"
      width="140"
      height="215"
      rx="32"
      fill="url(#cmScreen)"
      stroke="url(#cmPhoneBorder)"
      stroke-width="7.5"
      filter="url(#cmShadow)"
    />

    <!-- Dynamic Island / Speaker Pill at Top -->
    <rect
      x="220"
      y="94"
      width="40"
      height="7"
      rx="3.5"
      fill="#475569"
    />

    <!-- Inner Screen Display Area with Amber Border -->
    <rect
      x="180"
      y="110"
      width="120"
      height="170"
      rx="20"
      fill="#0B0F19"
      stroke="#F59E0B"
      stroke-width="1.5"
    />

    <!-- Speed Aerodynamic Hash Marks -->
    <rect x="268" y="125" width="22" height="4" rx="2" fill="url(#cmAmber)" filter="url(#cmAmberGlow)" />
    <rect x="274" y="137" width="16" height="3.5" rx="1.75" fill="url(#cmAmber)" filter="url(#cmAmberGlow)" />
    <rect x="280" y="149" width="10" height="3" rx="1.5" fill="url(#cmAmber)" filter="url(#cmAmberGlow)" />

    <!-- Big Stylized 'C' monogram -->
    <path
      d="M 265 145 C 248 132 225 132 208 145 C 190 159 184 186 186 210 C 188 232 202 248 225 252 C 240 254 254 248 264 238 L 252 222 C 245 228 236 232 226 230 C 213 228 206 216 206 204 C 206 190 214 176 226 170 C 235 166 245 170 252 176 Z"
      fill="url(#cmAmber)"
      filter="url(#cmAmberGlow)"
    />

    <!-- Stylized 'M' monogram nestled with 'C' -->
    <path
      d="M 218 178 L 240 212 L 262 178 L 274 240 L 256 240 L 250 206 L 240 222 L 230 206 L 224 240 L 206 240 Z"
      fill="url(#cmChrome)"
      stroke="#64748B"
      stroke-width="1"
    />
  </g>

  <!-- Title: "CRAZY" -->
  <g>
    <text
      x="250"
      y="370"
      text-anchor="middle"
      font-family="'Inter', 'Montserrat', sans-serif"
      font-size="64"
      font-weight="900"
      letter-spacing="4"
      fill="url(#cmRoyalBlue)"
      stroke="#1D4ED8"
      stroke-width="1.5"
    >CRAZY</text>
    
    <!-- Amber Triangle inside letter 'A' -->
    <polygon
      points="250,332 242,347 258,347"
      fill="#F59E0B"
      filter="url(#cmAmberGlow)"
    />
  </g>

  <!-- Subtitle: "— MOBILES —" -->
  <g>
    <!-- Left Amber Accent Bar -->
    <rect x="70" y="405" width="55" height="5" rx="2.5" fill="#F59E0B" filter="url(#cmAmberGlow)" />
    
    <!-- Word "MOBILES" -->
    <text
      x="250"
      y="413"
      text-anchor="middle"
      font-family="'Inter', sans-serif"
      font-size="24"
      font-weight="700"
      letter-spacing="12"
      fill="#E2E8F0"
    >MOBILES</text>

    <!-- Right Amber Accent Bar -->
    <rect x="375" y="405" width="55" height="5" rx="2.5" fill="#F59E0B" filter="url(#cmAmberGlow)" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" fill="none">
  <defs>
    <!-- Neon Lime Green Gradient -->
    <linearGradient id="cmLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#A8FF3E" />
      <stop offset="50%" stopColor="#84F229" />
      <stop offset="100%" stopColor="#5BB716" />
    </linearGradient>

    <!-- Metallic Chrome Gradient -->
    <linearGradient id="cmChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="35%" stopColor="#E2E8F0" />
      <stop offset="70%" stopColor="#CBD5E1" />
      <stop offset="100%" stopColor="#94A3B8" />
    </linearGradient>

    <!-- Phone Frame Metallic Border -->
    <linearGradient id="cmPhoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="45%" stopColor="#CBD5E1" />
      <stop offset="85%" stopColor="#64748B" />
      <stop offset="100%" stopColor="#334155" />
    </linearGradient>

    <!-- Soft Cyber Screen Fill -->
    <linearGradient id="cmScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#222B32" />
      <stop offset="100%" stopColor="#12181C" />
    </linearGradient>

    <!-- Lime Neon Glow Filter -->
    <filter id="cmLimeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" floodColor="#84F229" floodOpacity="0.55" />
    </filter>

    <!-- Metallic 3D Drop Shadow -->
    <filter id="cmShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" floodColor="#000000" floodOpacity="0.75" />
    </filter>
  </defs>

  <!-- Background Soft Cyber Radial Backdrop -->
  <rect width="500" height="500" rx="36" fill="#0A0D0F" />
  <circle cx="250" cy="180" r="140" fill="#84F229" opacity="0.08" filter="blur(40px)" />

  <!-- Tilted Smartphone Body -->
  <g transform="translate(250 185) rotate(-11) translate(-250 -185)">
    <!-- Outer Phone Shell with Chrome Bevel -->
    <rect
      x="170"
      y="80"
      width="140"
      height="215"
      rx="32"
      fill="url(#cmScreen)"
      stroke="url(#cmPhoneBorder)"
      stroke-width="7.5"
      filter="url(#cmShadow)"
    />

    <!-- Top Speaker / Camera Notch -->
    <rect x="215" y="93" width="50" height="7.5" rx="3.75" fill="#334155" />

    <!-- Inner Screen Accent Border -->
    <rect
      x="178"
      y="110"
      width="124"
      height="170"
      rx="22"
      fill="none"
      stroke="#334155"
      stroke-width="1.5"
      stroke-opacity="0.6"
    />

    <!-- Bottom Chin Accent Indicator -->
    <rect x="220" y="278" width="40" height="5" rx="2.5" fill="#475569" />
  </g>

  <!-- Aerodynamic Speed Lines extending from top-right of 'C' -->
  <g filter="url(#cmLimeGlow)">
    <rect x="278" y="146" width="60" height="10" rx="5" fill="url(#cmLime)" />
    <rect x="286" y="163" width="50" height="8.5" rx="4.25" fill="url(#cmLime)" />
    <rect x="294" y="179" width="36" height="7" rx="3.5" fill="url(#cmLime)" />
  </g>

  <!-- The Letter "C" - Bold, Sweeping Neon Lime Curve -->
  <path
    d="M 276 150 C 262 142 244 140 223 149 C 198 159 184 181 184 213 C 184 246 202 271 231 276 C 249 280 267 274 279 263 L 265 240 C 258 247 246 250 235 249 C 215 245 208 231 208 213 C 208 195 219 175 236 170 C 248 166 259 170 266 175 Z"
    fill="url(#cmLime)"
    filter="url(#cmLimeGlow)"
  />

  <!-- The Letter "M" - Futuristic Beveled Metallic Chrome -->
  <g filter="url(#cmShadow)">
    <path
      d="M 241 176 L 279 228 L 317 176 L 335 266 L 306 266 L 297 216 L 279 243 L 261 216 L 252 266 L 223 266 Z"
      fill="url(#cmChrome)"
      stroke="#64748B"
      stroke-width="2"
    />
    <!-- Chrome Highlight Polish on M -->
    <path
      d="M 246 183 L 279 228 L 263 220 L 256 259 L 230 259 Z"
      fill="#FFFFFF"
      fill-opacity="0.45"
    />
  </g>

  <!-- Typography: "CRAZY" -->
  <g filter="url(#cmShadow)">
    <text
      x="250"
      y="370"
      text-anchor="middle"
      font-family="'Orbitron', 'Space Grotesk', -apple-system, sans-serif"
      font-size="64"
      font-weight="900"
      letter-spacing="4"
      fill="url(#cmChrome)"
      stroke="#64748B"
      stroke-width="1.5"
    >CRAZY</text>
    
    <!-- Neon Lime Triangle inside letter 'A' -->
    <polygon
      points="250,332 242,347 258,347"
      fill="#84F229"
      filter="url(#cmLimeGlow)"
    />
  </g>

  <!-- Subtitle: "— MOBILE —" -->
  <g>
    <!-- Left Lime Accent Bar -->
    <rect x="70" y="405" width="55" height="5" rx="2.5" fill="#84F229" filter="url(#cmLimeGlow)" />
    
    <!-- Word "MOBILE" -->
    <text
      x="250"
      y="413"
      text-anchor="middle"
      font-family="'Orbitron', 'Rajdhani', sans-serif"
      font-size="24"
      font-weight="700"
      letter-spacing="12"
      fill="#E2E8F0"
    >MOBILE</text>

    <!-- Right Lime Accent Bar -->
    <rect x="375" y="405" width="55" height="5" rx="2.5" fill="#84F229" filter="url(#cmLimeGlow)" />
  </g>
</svg>
